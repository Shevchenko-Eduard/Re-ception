include:
  - ../Keycloak/docker-compose.yaml
    
services:

  server-employee-api:
    build:
      context: .
      dockerfile: employee-api.dockerfile
    container_name: server-employee-api
    depends_on:
      server-db:
        condition: service_healthy
      server-s3:
        condition: service_healthy
      server-cache:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - Keycloak__AuthServerUrl=${KEYCLOAK_AUTH_SERVER_URL}
      - Keycloak__Realm=${KEYCLOAK_EMPLOYEE_REALM}
      - Keycloak__Resource=${KEYCLOAK_EMPLOYEE_RESOURCE}
      - Keycloak__Secret=${KEYCLOAK_EMPLOYEE_SECRET}

      - Minio__Endpoint=${S3_HOST}:${S3_PORT}
      - Minio__Username=${MINIO_ROOT_USER}
      - Minio__Password=${MINIO_ROOT_PASSWORD}
      - Minio__HTTPS=false

      - DB__Host=server-db
      - DB__Port=5432
      - DB__Database=${SERVER_POSTGRES_DB}
      - DB__Username=${SERVER_POSTGRES_USER}
      - DB__Password=${SERVER_POSTGRES_PASSWORD}

      - Redis__Endpoint=server-cache:${CACHE_PORT}
      - Redis__InstanceName=${REDIS_INSTANCE_NAME}
      - Redis__Password=${CACHE_PASSWORD}

      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}

      - LOG_LEVEL=debug
    ports:
      - "${EMPLOYEE_API_PORT}:${ASPNETCORE_PORT}"
    networks:
      - server-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${EMPLOYEE_API_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  server-customer-api:
    build:
      context: .
      dockerfile: customer-api.dockerfile
    container_name: server-customer-api
    depends_on:
      server-db:
        condition: service_healthy
      server-s3:
        condition: service_healthy
      server-cache:
        condition: service_healthy
    environment:
      - Keycloak__AuthServerUrl=${KEYCLOAK_AUTH_SERVER_URL}
      - Keycloak__Realm=${KEYCLOAK_CUSTOMER_REALM}
      - Keycloak__Resource=${KEYCLOAK_CUSTOMER_RESOURCE}
      - Keycloak__Secret=${KEYCLOAK_CUSTOMER_SECRET}

      - Minio__Endpoint=${S3_HOST}:${S3_PORT}
      - Minio__Username=${MINIO_ROOT_USER}
      - Minio__Password=${MINIO_ROOT_PASSWORD}
      - Minio__HTTPS=false

      - DB__Host=server-db
      - DB__Port=5432
      - DB__Database=${SERVER_POSTGRES_DB}
      - DB__Username=${SERVER_POSTGRES_USER}
      - DB__Password=${SERVER_POSTGRES_PASSWORD}

      - Redis__Endpoint=server-cache:${CACHE_PORT}
      - Redis__InstanceName=${REDIS_INSTANCE_NAME}
      - Redis__Password=${CACHE_PASSWORD}

      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}

      - LOG_LEVEL=debug
    ports:
      - "${CUSTOMER_API_PORT}:${ASPNETCORE_PORT}"
    networks:
      - server-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CUSTOMER_API_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  server-db:
    image: postgres:18
    container_name: server-db
    ports:
      - ${SERVER_POSTGRES_PORT}:5432
    environment:
      POSTGRES_DB: ${SERVER_POSTGRES_DB}
      POSTGRES_USER: ${SERVER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SERVER_POSTGRES_PASSWORD}
    volumes:
      - server-db-data:/var/lib/postgresql
    networks:
      - server-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVER_POSTGRES_USER} -d ${SERVER_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server-s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: server-s3
    command: minio server /data
    volumes:
      - server-s3-data:/data
    ports:
      - "${S3_PORT}:${S3_PORT}"
      - "${S3_PORT_UI}:${S3_PORT_UI}"
    environment:
      - MINIO_CONSOLE_ADDRESS=${S3_HOST}:${S3_PORT_UI}
      - MINIO_ADDRESS=${S3_HOST}:${S3_PORT}

      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}

      - MINIO_SKIP_CERT_VERIFICATION=true
    networks:
      - server-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${S3_PORT}/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  server-cache:
    image: redis:8.6
    container_name: server-cache
    command: redis-server --requirepass ${CACHE_PASSWORD} --port ${CACHE_PORT}
    ports:
      - "${CACHE_PORT}:${CACHE_PORT}"
    networks:
      - server-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${CACHE_PORT} -a ${CACHE_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    

volumes:
  server-db-data:
  server-s3-data:

networks:
  server-network:
    driver: bridge