services:

  server-app:
    build:
      context: .
      dockerfile: app.dockerfile
    container_name: server-app
    depends_on:
      server-db:
        condition: service_healthy
      server-s3:
        condition: service_healthy
      server-cache:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@server-db:5432/${POSTGRES_DB}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}

      - LOG_LEVEL=debug
    ports:
      - "${APP_PORT}:${ASPNETCORE_PORT}"
    networks:
      - server-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  server-db:
    image: postgres:18
    container_name: server-db
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - server-db-data:/var/lib/postgresql
    networks:
      - server-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server-s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: server-s3
    command: minio server /data
    volumes:
      - server-s3-data:/data
    ports:
      - "${S3_PORT}:${S3_PORT}"
      - "${S3_PORT_UI}:${S3_PORT_UI}"
    environment:
      - MINIO_CONSOLE_ADDRESS=${S3_HOST}:${S3_PORT_UI}
      - MINIO_ADDRESS=${S3_HOST}:${S3_PORT}

      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}

      - MINIO_SKIP_CERT_VERIFICATION=true
    networks:
      - server-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${S3_PORT}/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  server-cache:
    image: redis:8.6
    container_name: server-cache
    command: redis-server --requirepass ${CACHE_PASSWORD} --port ${CACHE_PORT}
    ports:
      - "${CACHE_PORT}:${CACHE_PORT}"
    networks:
      - server-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${CACHE_PORT} -a ${CACHE_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    

volumes:
  server-db-data:
  server-s3-data:

networks:
  server-network:
    driver: bridge