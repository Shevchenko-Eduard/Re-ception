services:
  nginx:
    image: nginx:1.30-alpine
    container_name: nginx
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
      - "${KEYCLOAK_HTTP_PORT}:${KEYCLOAK_HTTP_PORT}"
    volumes:
      - ./certs/:/etc/nginx/certs/:ro
      - ./conf/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
    environment:
      - PORT_EMPLOYEE=${ASPNETCORE_PORT}
      - HOST_EMPLOYEE=employee-api
      - PORT_CUSTOMER=${ASPNETCORE_PORT}
      - HOST_CUSTOMER=customer-api
      - PORT_AUTH=${KEYCLOAK_HTTP_PORT}
      - HOST_AUTH=keycloak

      - NGINX_DOMAIN=${NGINX_DOMAIN}
    networks:
      - nginx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
    restart: unless-stopped

networks:
  nginx-network:
    driver: bridge